<header class="bg-body-tertiary border-bottom">
    <nav class="container py-3" aria-label="Основная навигация">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <a class="fs-4 fw-bold text-success-emphasis text-decoration-none" href="{% url 'index' %}">Mailer</a>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-light" href="{% url 'index' %}">Главная</a>
                <a class="btn btn-outline-light" href="{% url 'list_recipients' %}">Получатели</a>
                <a class="btn btn-outline-light" href="{% url 'list_messages' %}">Сообщения</a>
                <a class="btn btn-outline-light" href="{% url 'list_mailers' %}">Рыссылки</a>
                <a class="btn btn-success" href="{% url 'create_recipient' %}">Добавить получателя</a>
                <a class="btn btn-success" href="{% url 'create_message' %}">Добавить сообщение</a>
                <a class="btn btn-success" href="{% url 'create_mailer' %}">Добавить рассылку</a>
                {% if user.is_authenticated %}
                <a class="btn btn-success" href="{% url 'mailer_statistic' %}">Статистика</a>
                <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        Выйти
                    </button>
                </form>
                {% else %}
                <a class="btn btn-outline-light" href="{% url 'login' %}">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
