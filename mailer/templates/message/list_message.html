{% extends "base.html" %}

{% block title %}Mailer - Список сообщений{% endblock %}

{% block content %}
<div class="container py-5">
    <section class="container pb-5" aria-labelledby="catalog-title">
        <div class="row g-4 justify-content-center">
            {% for message in messages %}
            <div class="col-sm-10 col-md-6 col-lg-4 py-5">
                <article class="card h-100 shadow-sm">
                    <div class="card-header text-center py-3">
                        <h3 class="h1 mb-0">{{ message.topic }}</h3>
                    </div>
                    <div class="card-body d-flex flex-column p-4">
                        <p class="display-7 fw-semibold text-center">{{ message.message|truncatechars:100 }}</p>
                        <a class="btn btn-outline-success btn-lg mt-auto" type="button"
                           href="{% url 'detail_message' pk=message.pk %}">Подробнее</a>
                    </div>
                </article>
            </div>
            {% endfor %}
        </div>
    </section>
</div>
{% endblock %}
